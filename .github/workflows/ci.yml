name: CI — Validación y Compilación

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Diagnóstico y Compilación (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias limpias (npm ci)
        run: npm ci

      - name: Ejecutar diagnósticos estáticos (Astro Check & TypeScript)
        run: npm run check

      - name: Compilar sitio estático (Astro Build)
        run: npm run build
